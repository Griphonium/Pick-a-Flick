<script>

function parseCSV(text){
  const rows=[];let row=[],f="",q=false;text=text.replace(/^\uFEFF/,"");
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c=='"'){if(text[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true;else if(c==","){row.push(f);f=""}
    else if(c=="\n"||c=="\r"){if(c=="\r"&&text[i+1]=="\n")i++;row.push(f);rows.push(row);row=[];f=""}else f+=c}
  if(f||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()));
}

  const cj=js=>mc.crew.filter(c=>js.includes(c.job));
  const parts=[["Acting",mc.cast,"character"],["Directing",cj(["Director"]),""],["Writing",cj(["Writer","Screenplay","Story"]),""],["Producing",cj(["Producer"]),""]].map(([t,a,k])=>[t,fc(a,k)]).filter(x=>x[1]);
  const main={Acting:"Acting",Directing:"Directing",Writing:"Writing",Production:"Producing"}[d.known_for_department];
  parts.sort((a,b)=>(b[0]===main)-(a[0]===main));
  const bio=(d.biography||"").trim(),born=[d.birthday?"Born "+d.birthday:"",d.place_of_birth||""].filter(Boolean).join(" · ");
  return `<div class="dbody nohero"><div class="dh">${av(d,"dp","w342")}<div class="grow"><h2 style="margin:0">${esc(d.name)}</h2><p class="meta">${esc([d.known_for_department,born].filter(Boolean).join(" · "))}</p></div></div>${bio?`<h3 class="sh">Biography</h3><p style="margin:0">${esc(bio.length>700?bio.slice(0,700)+"…":bio)}</p>`:""}${parts.map(([t,h])=>`<h3 class="sh">${t}</h3><div class="fg">${h}</div>`).join("")||`<p class="empty">No filmography found.</p>`}</div>`;
}
function drawModal(){

function discoverView(){
  const top=S.popular.slice(0,10),cols=Math.max(1,Math.floor(($("view").clientWidth+(innerWidth>=1000?18:12))/(innerWidth>=1000?198:152))),all=S.popular.slice(10),cards=S.results||(all.length>cols?all.slice(0,Math.floor(all.length/cols)*cols):all);

  }

  if(!S.results&&S.popular.length)h+=`<p style="text-align:center;margin-top:16px"><button class="btn pri" data-more="1">Load more</button></p>`;
  h+=`<details class="card" style="margin-top:18px"><summary>Import a watchlist</summary><p class="meta">Choose a CSV with a Name (or Title) column and optionally Year. Letterboxd’s watchlist.csv works. The file stays on your device.</p><input type="file" id="file" accept=".csv,text/csv" aria-label="Choose a CSV file"><p class="meta" id="msg">${esc(S.msg)}</p></details>`;

function rankView(){
  const k=S.mode==="duel"?2:5;
  let h=`<div class="seg" role="group" aria-label="Ranking mode"><button data-mode="duel" aria-pressed="${S.mode==="duel"}">Head to head</button><button data-mode="five" aria-pressed="${S.mode==="five"}">Rank 5</button></div><p class="desc">${S.mode==="duel"?"This or that? Let movies on your watchlist duke it out until you get bored. The more you rank with this tool, the more accurate your watchlist. Have fun!":"Say hello to rank choice voting! The best way to elect government officials, and also rank your watchlist! Have fun!"}</p>`;
  if(S.items.length<k)return h+`<p class="empty">Add at least ${k} movies to rank this way.</p>`;
  const seen=S.items.filter(x=>x.n>0).length,bar=`<div class="bar" aria-hidden="true"><i style="width:${Math.round(100*seen/S.items.length)}%"></i></div><p class="meta" style="text-align:center">${seen} of ${S.items.length} movies ranked at least once</p>`;
  const by=id=>S.items.find(x=>x.id===id);
  if(S.mode==="duel"){
    if(!S.pair||S.pair.some(id=>!by(id)))S.pair=pickGroup(2);
    const side=x=>`<div><button class="pick" data-win="${x.id}">${img(x.poster,"pp")}<span class="t">${esc(x.name)}</span><span class="meta">${esc(x.year)}</span></button><button class="btn sm x" data-rm="${x.id}" style="margin-top:6px;width:100%">Remove</button></div>`;
    const [a,b]=S.pair.map(by);
    return h+`<h2 style="margin:0;font-size:1.15rem;text-align:center">Which would you watch first?</h2><div class="duel">${side(a)}<div class="vs">or</div>${side(b)}</div><div class="row ctr"><button class="btn" data-tie="1">Tie</button><button class="btn" data-skip="1">Skip</button></div>${bar}`;
  }
  if(!S.five||S.five.some(id=>!by(id)))S.five=pickGroup(5),S.picks=[];
  h+=`<h2 style="margin:0 0 10px;font-size:1.15rem;text-align:center">Tap your 5 in order, best first</h2><div class="pk5">`+S.five.map(by).map(x=>{const i=S.picks.indexOf(x.id);return `<button class="card row pk" data-pick="${x.id}" aria-pressed="${i>=0}"><span class="num">${i>=0?i+1:""}</span>${img(x.poster,"th")}<span class="grow"><span class="t">${esc(x.name)}</span><br><span class="meta">${esc(meta(x))}${rowRats(x)}</span></span></button>`}).join("")+`</div>`;
  return h+`<div class="row ctr"><button class="btn pri" data-lock="1" ${S.picks.length<5?"disabled":""}>Lock in ranking</button><button class="btn" data-clearpicks="1">Reset</button><button class="btn" data-skip5="1">Skip</button></div>${bar}`;
}
const canDrag=()=>S.f.sort==="rank"&&!S.f.genre&&S.f.lo===0&&S.f.hi===180&&!S.f.rate&&!S.svc.length;
function listHTML(){
  const {order,lab}=rankInfo(),rows=order.filter(passes),k=S.f.sort;
  if(!S.items.length)return `<p class="empty">Your watchlist is empty. Add movies from Discover.</p>`;
  if(!rows.length)return `<p class="empty">Nothing matches these filters.</p>`;
  if(k==="agea")rows.sort((a,b)=>(AGE[a.cert]||9)-(AGE[b.cert]||9));
  else if(k==="aged")rows.sort((a,b)=>(AGE[b.cert]||0)-(AGE[a.cert]||0));
  else if(k==="len")rows.sort((a,b)=>(a.rt||999)-(b.rt||999));
  else if(k==="rate")rows.sort((a,b)=>(rv(b)||0)-(rv(a)||0));
  const dr=canDrag();
  return (dr?`<p class="meta" style="text-align:center;margin:0 0 10px">Drag ⠿ to move a movie. Its score updates to match.</p>`:"")+rows.map(x=>{
    const info=`<span class="grow"><span class="t">${esc(x.name)}</span><br><span class="meta">${esc(meta(x))}${rowRats(x)}${x.genres.length?" · "+esc(x.genres.slice(0,2).join(", ")):""}${x.n?" · Score "+Math.round(x.elo):""}</span></span>`;
    return `<div class="card row" data-id="${x.id}">${dr?`<button class="dg" data-dg="${x.id}" aria-label="Reorder ${esc(x.name)}. Drag, or use the up and down arrow keys." title="Drag to reorder">⠿</button>`:""}<div class="rank" title="${lab[x.id]?"":"Not ranked yet"}">${lab[x.id]||"–"}</div>${x.tid?`<button class="mvr" data-open="${x.tid}">${img(x.poster,"th")}${info}</button>`:`${img(x.poster,"th")}<div class="grow">${info}</div>`}<div class="acts"><button class="btn sm ab wd" data-watched="${x.id}" aria-label="Mark ${esc(x.name)} as watched"><span class="ic">✓</span><span class="rl">Watched</span></button><button class="btn sm ab x" data-rm="${x.id}" aria-label="Remove ${esc(x.name)}"><span class="ic">✕</span><span class="rl">Remove</span></button></div></div>`}).join("");
}
function watchView(){
  const gs=[...new Set(S.items.flatMap(x=>x.genres))].sort(),f=S.f;
  const so=[["rank","My ranking"],["agea","Age rating: low to high"],["aged","Age rating: high to low"],["len","Length: short to long"],["rate","Rating: high to low"]];
  return `<p class="desc">You want to finish your watchlist before you kick the bucket, don’t ya!?! When you’re on your deathbed, find comfort in the fact that you watched all the movies you wanted to get to. “Thanks Pick-a-Flick”, you’ll say...</p><div class="wlay"><aside class="card filters"><div><label class="l" for="fg">Genre</label><select id="fg"><option value="">All genres</option>${gs.map(g=>`<option${g===f.genre?" selected":""}>${esc(g)}</option>`).join("")}</select></div>

  <div class="full"><span class="l" style="display:block">My streaming services</span><div id="svcs" class="pl">${svcHTML()}</div></div>

  <div class="wmain"><div id="wl">${listHTML()}</div>${S.items.length?`<div class="row ctr" style="margin-top:18px"><button class="btn pri" data-export="1">Download CSV</button><button class="btn del" data-reset="1">Clear list</button></div>`:""}</div></div>`;
}
const drawWL=()=>{const w=$("wl");if(w)w.innerHTML=listHTML()};
function updFill(){const f=$("fill");if(!f)return;f.style.left=S.f.lo/1.8+"%";f.style.width=(S.f.hi-S.f.lo)/1.8+"%";$("flo").style.zIndex=S.f.lo>S.f.hi-30?5:2;$("fhi").style.zIndex=3;$("lenl").textContent=rng(S.f.lo,S.f.hi)}
function reorder(id,ids){
  const by=i=>S.items.find(x=>x.id===i),m=by(id);if(!m)return drawWL();
  const seq=ids.map(by).filter(x=>x&&(x.n>0||x===m)),i=seq.indexOf(m),a=seq[i-1],b=seq[i+1];
  m.elo=a&&b?(a.elo+b.elo)/2:a?a.elo-10:b?b.elo+10:m.elo;if(!m.n)m.n=1;save();drawWL();

function startDrag(e,row){
  e.preventDefault();const list=$("wl");row.classList.add("dragging");
  const move=ev=>{
    const rows=[...list.querySelectorAll(".card.row")].filter(r=>r!==row);
    const after=rows.find(r=>{const b=r.getBoundingClientRect();return ev.clientY<b.top+b.height/2});
    list.insertBefore(row,after||null);
    if(ev.clientY<80)window.scrollBy(0,-14);else if(ev.clientY>innerHeight-80)window.scrollBy(0,14);
  };
  const up=()=>{window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);window.removeEventListener("pointercancel",up);row.classList.remove("dragging");reorder(row.dataset.id,[...list.querySelectorAll(".card.row")].map(r=>r.dataset.id))};
  window.addEventListener("pointermove",move);window.addEventListener("pointerup",up);window.addEventListener("pointercancel",up);
}
function drawConfirm(){
  const el=$("cfm");if(!S.confirm){el.innerHTML="";return}
  el.innerHTML=`<div class="ov cfo" data-cfov="1"><div class="dlg cfd" role="alertdialog" aria-modal="true" aria-labelledby="cft"><h2 id="cft" style="margin:0 0 8px">Clear your watchlist?</h2><p class="meta" style="margin:0 0 18px">This removes every movie and all of your rankings. This can’t be undone.</p><div class="row ctr"><button class="btn" data-cfno="1">Cancel</button><button class="btn del" data-cfyes="1">Yes, clear it</button></div></div></div>`;

function render(){
  const tabs=[["discover","Discover","Find movies to add to your watchlist."],["rank","Rank","Sort your watchlist by priority."],["watchlist","Watchlist","Picking a movie, made easy."]];
  $("nav").innerHTML=tabs.map(([k,t,tip])=>`<button role="tab" data-tab="${k}" data-tip="${esc(tip)}" aria-selected="${S.tab===k}">${IC[k]}${t}</button>`).join("");

function exportCSV(){
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"',{order,lab}=rankInfo();
  const out=["Rank,Name,Year,Age rating,Runtime,IMDb,Rotten Tomatoes (critics),Score"].concat(order.map(x=>[lab[x.id]||"",q(x.name),x.year,x.cert||"",x.rt||"",x.imdbR||"",x.rtR==null?"":x.rtR+"%",x.n?Math.round(x.elo):""].join(",")));
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([out.join("\n")],{type:"text/csv"}));a.download="pick-a-flick-ranking.csv";a.click();

let st;
document.addEventListener("click",e=>{
  const hm=e.target.closest("[data-home]");if(hm){e.preventDefault();S.tab="discover";S.q="";S.results=null;S.people=[];S.detail=null;S.confirm=false;drawModal();drawConfirm();render();window.scrollTo({top:0,behavior:"smooth"});return}
  if(e.target.dataset&&e.target.dataset.cfov){S.confirm=false;drawConfirm();return}
  if(e.target.dataset&&e.target.dataset.ov){S.detail=null;drawModal();return}

  else if(d.svc){const i=+d.svc,k=S.svc.indexOf(i);k<0?S.svc.push(i):S.svc.splice(k,1);saveSvc();$("svcs").innerHTML=svcHTML();drawWL()}

  else if(d.still){const c=b.closest(".stills"),t=c.querySelector(".strk"),n=t.children.length,i=((+c.dataset.i+ +d.still)%n+n)%n;c.dataset.i=i;t.style.transform=`translateX(-${i*100}%)`;c.querySelector(".cnt").textContent=`${i+1} / ${n}`}
});
document.addEventListener("input",e=>{

document.addEventListener("change",e=>{

document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(S.confirm){S.confirm=false;drawConfirm()}else if(S.detail){S.detail=null;drawModal()}}});
document.addEventListener("mouseover",e=>{S.hov=!!e.target.closest(".car")});

setInterval(()=>{if(S.tab==="discover"&&!S.hov&&!S.detail&&!matchMedia("(prefers-reduced-motion: reduce)").matches)go(S.slide+1)},6000);

document.addEventListener("pointerdown",e=>{const g=e.target.closest&&e.target.closest(".dg");if(g)startDrag(e,g.closest(".card.row"))});

applyTheme();render();
